[package]
name = "datasetop"
version = "0.6.0"
description = "Chat-first MCP folder agent"
edition = "2021"

[lib]
name = "datasetop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api"] }
tauri-plugin-opener = "2.6"
tauri-plugin-window-state = "2.5"
tauri-plugin-dialog = "2.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "process", "io-util", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.5", default-features = false, features = ["client", "reqwest", "transport-child-process", "transport-streamable-http-client-reqwest", "auth"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
base64 = "0.23"
